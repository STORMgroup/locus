# Caduceus-PS 0.47M with the recipe of caduceus-ps-0.47m-bf16.yaml in float32 (no autocast): scripts/reproduce.py plan
# baselines-fp32 (the precision check) and plan timing; each batch of 128 accumulated over 4 micro-batches of 32.
epochs: 20
batch_size: 128
learning_rate: 1.0e-3
warmup_fraction: 0.01
weight_decay: 0.1
min_learning_rate_ratio: 0.1
gradient_clip: 1.0
dropout: 0.1
autocast: float32
micro_batches: 4
validation_folds: 10
seed: 42
