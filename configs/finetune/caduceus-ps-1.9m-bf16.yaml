# Fine-tuning recipe of the Caduceus-PS 1.9M baseline (scripts/reproduce.py plans baselines, single-nucleotide and timing;
# scripts/finetune_baseline.py): the LoCUS-2M recipe in bfloat16 autocast, the precision of LoCUS, each batch of 128
# accumulated over 4 micro-batches of 32 (the update is that of the full batch). caduceus-ps-1.9m.yaml is the same in float32.
epochs: 20
batch_size: 128
learning_rate: 1.0e-3
warmup_fraction: 0.01
weight_decay: 0.1
min_learning_rate_ratio: 0.1
gradient_clip: 1.0
dropout: 0.1
autocast: bfloat16
micro_batches: 4
validation_folds: 10
seed: 42
