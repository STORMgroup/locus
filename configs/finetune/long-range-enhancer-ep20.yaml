# Fine-tuning recipe of the context-length ablation on the Genomics Long-Range Benchmark enhancer task
# (lrb_enhancer_4k / lrb_enhancer_16k, benchmarks/long_range/prepare_enhancer.py), used for LoCUS-2M and LoCUS-2M-16k.
# Validation: fold k of the stratified 10-fold split of the training set; the test set is scored once, at the selected
# epoch. The reported runs used --micro-batches 2 at 4 kb and --micro-batches 8 at 16 kb (same update, less memory):
#   python scripts/finetune.py --pretrained checkpoints/locus-2m.pt --recipe configs/finetune/long-range-enhancer-ep20.yaml \
#       --data-root data/benchmarks/long_range --task lrb_enhancer_4k --fold 0 --micro-batches 2 \
#       --output results/locus-2m/long_range_ep20/lrb_enhancer_4k/fold-00.json
epochs: 20
batch_size: 32
learning_rate: 3.0e-4
warmup_fraction: 0.01
weight_decay: 0.1
min_learning_rate_ratio: 0.1
gradient_clip: 1.0
dropout: 0.1
autocast: bfloat16
validation_folds: 10
seed: 42
test_every_epoch: false
