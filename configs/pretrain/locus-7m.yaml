# LoCUS-7M: LoCUS-2M at width 256 (8 heads, feed-forward 1024).
model:
  model_dim: 256
  attention_heads: 8
  ffn_dim: 1024
  base_attention_radii: [32, 128]
  segment_layers: 6
data:
  genome_windows: data/GRCh38.p14.acgt.w4096.s4096
  context_length: 4096
  segmenter: lcp
training:
  run_name: locus-7m
  batch_size: 16
